# Configuração de labels do repositório.
# Pode ser aplicada por github-label-sync ou similar.
#
# Categorias:
#   - kind/*    — tipo de mudança
#   - mes-NN-*  — em que mês do PICK 2026 essa issue se encaixa
#   - area/*    — área do código
#   - status/*  — workflow

# === Kind ===
- name: bug
  color: d73a4a
  description: Algo não está funcionando
- name: good first issue
  color: 7057ff
  description: Boa primeira issue pra começar
- name: enhancement
  color: a2eeef
  description: Nova feature ou pedido
- name: module-proposal
  color: 5319e7
  description: Proposta de módulo novo (cap MODULE-CONTRACT)
- name: runbook
  color: 0e8a16
  description: Documentação operacional / cenário de incidente
- name: documentation
  color: 0075ca
  description: Melhorias ou correções na documentação
- name: question
  color: d876e3
  description: Discussão / dúvida

