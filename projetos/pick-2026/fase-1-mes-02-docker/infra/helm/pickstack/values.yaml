web:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/linuxtips/pickstack-web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 5173
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10
