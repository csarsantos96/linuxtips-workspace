replicaCount: 2

image:
  repository: ghcr.io/linuxtips/pickstack-trilha-svc
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8084
  targetPort: 8084

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

config:
  serviceName: trilha-svc
  pgSchema: trilha
  logLevel: info
  logFormat: json

secretRef:
  name: pickstack-trilha-secrets

metrics:
  enabled: false
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    labels: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
