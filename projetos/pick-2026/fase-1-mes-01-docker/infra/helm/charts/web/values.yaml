replicaCount: 2

image:
  repository: ghcr.io/linuxtips/pickstack-web
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5173

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

config:
  serviceName: web
  logLevel: info
  logFormat: json
  publicApiUrl: "http://pickstack-api-gateway:8080"
  nodeEnv: production

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: pickstack.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

metrics:
  enabled: false
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    labels: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
