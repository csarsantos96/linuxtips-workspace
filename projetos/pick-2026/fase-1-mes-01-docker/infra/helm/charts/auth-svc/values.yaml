replicaCount: 2

image:
  repository: ghcr.io/linuxtips/pickstack-auth-svc
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

config:
  serviceName: auth-svc
  pgSchema: auth
  logLevel: info
  logFormat: json

# Referência a secret externo (criado fora do chart, ex: SealedSecrets / ESO).
secretRef:
  name: pickstack-auth-secrets

metrics:
  enabled: false
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    labels: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
