apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "svc.fullname" . }}-config
  labels:
    {{- include "svc.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ .Values.config.serviceName | quote }}
  PG_SCHEMA: {{ .Values.config.pgSchema | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  PORT: {{ .Values.service.targetPort | quote }}
